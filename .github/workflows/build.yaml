name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  exporter-unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests

  build:
    needs: exporter-unit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Read gcups version
        id: version
        run: echo "gcups=$(grep -oP '^ARG GCUPS_VERSION=\K.+' gcups/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build gcups
        uses: docker/build-push-action@v6
        with:
          context: gcups
          load: true
          tags: gcups:test
          cache-from: type=gha,scope=gcups
          cache-to: type=gha,scope=gcups,mode=max

      - name: Build exporter
        uses: docker/build-push-action@v6
        with:
          context: exporter
          load: true
          tags: gcups-exporter:test
          cache-from: type=gha,scope=exporter
          cache-to: type=gha,scope=exporter,mode=max

      - name: Smoke test
        run: tests/smoke.sh gcups:test gcups-exporter:test

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push gcups
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: gcups
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.gcups }}
          cache-from: type=gha,scope=gcups

      - name: Push exporter
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: exporter
          push: true
          tags: ${{ env.IMAGE }}/exporter:latest
          cache-from: type=gha,scope=exporter
