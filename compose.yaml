services:
  gcups:
    image: ghcr.io/n1eko/gcups:${GCUPS_VERSION:-1.1.10}
    build: ./gcups
    container_name: gcups
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Applied on every start. Set GCUPS_PASSWORD in .env or your shell.
      GCUPS_PASSWORD: ${GCUPS_PASSWORD:?set GCUPS_PASSWORD}
    volumes:
      - gcups-data:/var/lib/gcups
    devices:
      # Replace with your UPS: `readlink -f /dev/ups` on the host.
      - /dev/bus/usb/001/010:/dev/bus/usb/001/010

  gcups-exporter:
    image: ghcr.io/n1eko/gcups/exporter:latest
    build: ./exporter
    container_name: gcups-exporter
    restart: unless-stopped
    ports:
      - "9199:9199"
    environment:
      GCUPS_URL: http://gcups:8080
      GCUPS_PASSWORD: ${GCUPS_PASSWORD:?set GCUPS_PASSWORD}
    depends_on:
      - gcups

volumes:
  gcups-data:
